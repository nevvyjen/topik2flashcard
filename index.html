<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ศัพท์เกาหลี - แฟลชการ์ด & ข้อสอบ</title>
<style>
  :root{
    --main:#8c1d2f;
    --main-light:#b0293f;
    --bg:#faf6f4;
    --card:#ffffff;
    --text:#2c2020;
    --muted:#7a6a6a;
    --good:#2e7d32;
    --bad:#c62828;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Noto Sans Thai","Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    background:linear-gradient(135deg,var(--main),var(--main-light));
    color:#fff;
    padding:20px 16px;
    text-align:center;
  }
  header h1{margin:0;font-size:1.4rem;}
  header p{margin:4px 0 0;font-size:0.85rem;opacity:0.9;}
  nav{
    display:flex;
    justify-content:center;
    gap:8px;
    background:#fff;
    padding:10px;
    border-bottom:2px solid #eee;
    flex-wrap:wrap;
    position:sticky;
    top:0;
    z-index:10;
  }
  nav button{
    border:none;
    background:#f1e6e6;
    color:var(--main);
    padding:10px 18px;
    border-radius:20px;
    font-size:0.95rem;
    cursor:pointer;
    font-weight:600;
    transition:0.2s;
  }
  nav button.active{
    background:var(--main);
    color:#fff;
  }
  main{
    max-width:720px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  .view{display:none;}
  .view.active{display:block;}

  /* Flashcards */
  .flash-controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    font-size:0.9rem;
    color:var(--muted);
  }
  .card-stage{
    perspective:1200px;
    height:280px;
    margin-bottom:16px;
  }
  .flashcard{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.5s;
    cursor:pointer;
  }
  .flashcard.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
    box-shadow:0 6px 20px rgba(0,0,0,0.12);
  }
  .face.front{
    background:var(--card);
    border:2px solid var(--main-light);
  }
  .face.back{
    background:var(--main);
    color:#fff;
    transform:rotateY(180deg);
  }
  .speak-btn{
    position:absolute;
    top:14px;
    right:14px;
    border:none;
    background:#f1e6e6;
    color:var(--main);
    width:40px;
    height:40px;
    border-radius:50%;
    font-size:1.2rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .speak-btn-back{
    background:rgba(255,255,255,0.25);
    color:#fff;
  }
  .speak-btn:active{transform:scale(0.9);}
  .word-kr{font-size:2rem;font-weight:700;color:var(--main);}
  .word-level{
    display:inline-block;
    margin-top:8px;
    font-size:0.75rem;
    background:#f1e6e6;
    color:var(--main);
    padding:3px 10px;
    border-radius:12px;
  }
  .word-hint{margin-top:14px;font-size:0.9rem;color:var(--muted);}
  .word-th{font-size:1.4rem;font-weight:700;}
  .word-ex{margin-top:14px;font-size:0.9rem;line-height:1.5;opacity:0.95;}
  .word-syn{margin-top:10px;font-size:0.8rem;opacity:0.85;}
  .btn-row{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .btn{
    border:none;
    padding:12px 18px;
    border-radius:10px;
    font-size:0.95rem;
    cursor:pointer;
    font-weight:600;
  }
  .btn-nav{background:#eee;color:var(--text);}
  .btn-know{background:var(--good);color:#fff;}
  .btn-unknow{background:var(--bad);color:#fff;}
  .btn-primary{background:var(--main);color:#fff;}
  .progress-bar{
    height:8px;
    background:#eee;
    border-radius:4px;
    overflow:hidden;
    margin-bottom:14px;
  }
  .progress-fill{
    height:100%;
    background:var(--main);
    width:0%;
    transition:width 0.3s;
  }

  /* Quiz & Fill-in */
  .q-box{
    background:var(--card);
    border-radius:14px;
    padding:20px;
    box-shadow:0 4px 14px rgba(0,0,0,0.08);
    margin-bottom:16px;
  }
  .q-count{font-size:0.85rem;color:var(--muted);margin-bottom:6px;}
  .q-text{font-size:1.2rem;font-weight:700;margin-bottom:16px;}
  .q-sentence{font-size:1.1rem;line-height:1.6;margin-bottom:16px;}
  .blank{
    display:inline-block;
    min-width:70px;
    border-bottom:2px solid var(--main);
    text-align:center;
    font-weight:700;
    color:var(--main);
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt-btn{
    text-align:left;
    padding:12px 14px;
    border-radius:10px;
    border:2px solid #e5d8d8;
    background:#fff;
    cursor:pointer;
    font-size:1rem;
  }
  .opt-btn:hover{border-color:var(--main-light);}
  .opt-btn.correct{background:#e6f4ea;border-color:var(--good);color:var(--good);}
  .opt-btn.wrong{background:#fdecea;border-color:var(--bad);color:var(--bad);}
  .opt-btn[disabled]{cursor:default;}
  .fill-input{
    width:100%;
    padding:12px;
    font-size:1rem;
    border-radius:10px;
    border:2px solid #e5d8d8;
    margin-bottom:12px;
  }
  .score-box{
    text-align:center;
    padding:30px 20px;
  }
  .score-box h2{color:var(--main);}
  .feedback{
    margin-top:10px;
    font-size:0.9rem;
    font-weight:600;
  }
  .feedback.good{color:var(--good);}
  .feedback.bad{color:var(--bad);}
  .list-view{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .list-item{
    background:var(--card);
    border-radius:12px;
    padding:14px 16px;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
  }
  .list-item .word-kr{font-size:1.3rem;}
  .list-item .word-th{font-size:1rem;font-weight:600;color:var(--main);}
  .list-item .word-ex{font-size:0.85rem;color:var(--muted);margin-top:4px;}
  footer{
    text-align:center;
    color:var(--muted);
    font-size:0.8rem;
    padding:20px;
  }

  /* ===== Responsive: phone portrait ===== */
  @media (max-width: 480px){
    header h1{font-size:1.15rem;}
    header p{font-size:0.78rem;}
    nav{gap:6px;padding:8px;}
    nav button{padding:8px 12px;font-size:0.82rem;}
    main{padding:14px 10px 50px;}
    .card-stage{height:250px;}
    .word-kr{font-size:1.6rem;}
    .word-th{font-size:1.2rem;}
    .word-ex{font-size:0.82rem;}
    .q-text{font-size:1.05rem;}
    .q-sentence{font-size:1rem;}
    .btn{padding:10px 12px;font-size:0.85rem;}
  }

  /* ===== Responsive: tablet / iPad landscape (wide screens) ===== */
  @media (min-width: 900px){
    main{max-width:960px;}
    .card-stage{height:320px;}
    .word-kr{font-size:2.4rem;}
    .word-th{font-size:1.7rem;}
    .word-ex{font-size:1rem;}
    .options{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }
    .list-view{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }
    .q-box{padding:28px;}
  }

  /* ===== Responsive: iPad landscape specifically (short height, wide width) ===== */
  @media (min-width: 900px) and (max-height: 700px) and (orientation: landscape){
    header{padding:12px 16px;}
    nav{position:static;}
    main{padding:14px 24px 40px;}
    .card-stage{height:230px;}
  }
</style>
</head>
<body>

<header>
  <h1>📚 ศัพท์เกาหลี TOPIK</h1>
  <p>คำกริยา 43 คำ พร้อมตัวอย่างประโยค</p>
</header>

<nav>
  <button class="active" data-view="flash">แฟลชการ์ด</button>
  <button data-view="quiz">ข้อสอบ (เลือกตอบ)</button>
  <button data-view="fill">เติมประโยค</button>
  <button data-view="list">รายการคำศัพท์</button>
</nav>

<main>

  <!-- FLASHCARDS -->
  <section id="flash" class="view active">
    <div class="progress-bar"><div class="progress-fill" id="flashProgress"></div></div>
    <div class="flash-controls">
      <span id="flashPos">1 / 43</span>
      <span id="flashScore">รู้แล้ว 0 | ยังไม่รู้ 0</span>
    </div>
    <div class="card-stage">
      <div class="flashcard" id="flashcard">
        <div class="face front">
          <button class="speak-btn" id="speakFront" onclick="event.stopPropagation(); speakWord();">🔊</button>
          <div class="word-kr" id="fcKr"></div>
          <div class="word-level" id="fcLevel"></div>
          <div class="word-hint">แตะการ์ดเพื่อดูความหมาย</div>
        </div>
        <div class="face back">
          <button class="speak-btn speak-btn-back" id="speakBack" onclick="event.stopPropagation(); speakWord();">🔊</button>
          <div class="word-th" id="fcTh"></div>
          <div class="word-ex" id="fcEx"></div>
          <div class="word-syn" id="fcSyn"></div>
        </div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-unknow" onclick="markCard(false)">❌ ยังไม่รู้</button>
      <button class="btn btn-know" onclick="markCard(true)">✅ รู้แล้ว</button>
    </div>
    <div class="btn-row" style="margin-top:12px;">
      <button class="btn btn-nav" onclick="prevCard()">⬅ ก่อนหน้า</button>
      <button class="btn btn-nav" onclick="shuffleCards()">🔀 สุ่มใหม่</button>
      <button class="btn btn-nav" onclick="nextCard()">ถัดไป ➡</button>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="view">
    <div id="quizArea"></div>
  </section>

  <!-- FILL IN THE BLANK -->
  <section id="fill" class="view">
    <div id="fillArea"></div>
  </section>

  <!-- LIST -->
  <section id="list" class="view">
    <div class="list-view" id="listArea"></div>
  </section>

</main>

<footer>ทำจากไฟล์คำศัพท์ที่อัปโหลด • เก็บไฟล์นี้ไว้ทบทวนได้ตลอด</footer>

<script>
const VOCAB = [
{kr:"가리다¹", th:"ปิด, บัง, ปกปิด", level:"3급", ex:"그녀는 부끄러움에 얼굴을 가렸다.", exTh:"เธอปิดใบหน้าด้วยความเขินอาย", syn:"คำพ้อง: 감싸다"},
{kr:"가리다²", th:"แยกแยะ, แยก, เลือก", level:"4급", ex:"시시비비를 가릴 필요가 있다.", exTh:"จำเป็นต้องแยกแยะการกระทำที่ถูกและผิด", syn:"คำพ้อง: 가려내다"},
{kr:"갇히다", th:"ติดอยู่, ถูกขัง, ถูกกักตัว", level:"4급", ex:"그는 오랫동안 엘리베이터에 갇혔다.", exTh:"เขาติดอยู่ในลิฟต์เป็นเวลานาน"},
{kr:"감싸다", th:"พัน, ห่อ, ห่อหุ้ม", level:"4급", ex:"그는 다친 곳을 붕대로 감쌌다.", exTh:"เขาพันผ้าพันแผลบริเวณที่บาดเจ็บ"},
{kr:"감추다", th:"ซ่อน, ซุกซ่อน, อำพราง", level:"4급", ex:"비상금을 서랍 속에 감추었다.", exTh:"ซ่อนเงินฉุกเฉินไว้ในลิ้นชัก"},
{kr:"갖추다", th:"มี, มีพร้อม", level:"4급", ex:"이곳은 최신 기자재를 갖춘 교실이다.", exTh:"ที่นี่เป็นห้องเรียนที่มีอุปกรณ์ใหม่ล่าสุด"},
{kr:"건네다", th:"ยื่น, ยื่นให้, ส่งให้", level:"4급", ex:"그녀는 나에게 손수건을 건넸다.", exTh:"เธอยื่นผ้าเช็ดหน้าให้ฉัน"},
{kr:"겪다", th:"ประสบ, ได้รับ, เผชิญ", level:"4급", ex:"그는 고통을 겪고 한층 강해졌다.", exTh:"เขาประสบกับความยากลำบากจนแข็งแกร่งขึ้นไปอีกขั้น", syn:"คำพ้อง: 치르다"},
{kr:"견디다", th:"อดทน, ทน, อดกลั้น", level:"4급", ex:"고통을 견딘 만큼 성숙해졌다.", exTh:"เพราะเป็นผู้ใหญ่ขึ้น จึงทนต่อความยากลำบากมา", syn:"คำพ้อง: 버티다"},
{kr:"구하다", th:"หา, เสาะหา", level:"3급", ex:"일자리를 구하는 것이 갈수록 어렵다.", exTh:"การหางาน ยิ่งหายิ่งยาก", syn:"คำพ้อง: 얻다, 찾다"},
{kr:"기대다", th:"พิง, อิง, ชม", level:"3급", ex:"난간에 몸을 기대는 것은 위험하다.", exTh:"การพิงตัวมาด้านหน้าจะมองเห็นได้ชัด"},
{kr:"기울이다", th:"เอน, เอียง", level:"4급", ex:"몸을 앞으로 기울이면 잘 보인다.", exTh:"ถ้าเอนตัวมาด้านหน้าจะมองเห็นได้ชัด"},
{kr:"깔다", th:"ปู, กาง, กางออก", level:"4급", ex:"나는 아이에게 이부자리를 깔아 주었다.", exTh:"ฉันปูที่นอนให้ลูก", syn:"คำพ้อง: 펴다 | ตรงข้าม: 개키다"},
{kr:"깨다", th:"ทำ...แตก, แตก", level:"4급", ex:"설거지를 하다가 그릇을 깼다.", exTh:"ล้างจานอยู่แล้วทำถ้วยแตก", syn:"คำพ้อง: 깨뜨리다"},
{kr:"깨닫다", th:"สำนึก, ตระหนัก, เข้าใจ", level:"4급", ex:"잘못을 일찍 깨달아서 다행이다.", exTh:"โชคดีที่สำนึกผิดได้เร็ว", syn:"คำพ้อง: 알아차리다"},
{kr:"깨지다", th:"แตก, แตกร้าว", level:"3급", ex:"식탁 위의 화병이 깨졌다.", exTh:"แจกันดอกไม้บนโต๊ะอาหารแตก"},
{kr:"꽂다", th:"ปัก, เสียบ, ใส่", level:"3급", ex:"선물 받은 꽃을 화병에 꽂았다.", exTh:"ปักดอกไม้ที่ได้รับเป็นของขวัญใส่แจกัน", syn:"ตรงข้าม: 빼다, 뽑다"},
{kr:"꾸미다", th:"ตกแต่ง, ประดับ, แต่ง", level:"4급", ex:"크리스마스를 위해 집을 꾸몄다.", exTh:"ตกแต่งบ้านสำหรับเทศกาลคริสต์มาส"},
{kr:"꿈꾸다", th:"ฝัน, ใฝ่ฝัน, มีฝัน", level:"4급", ex:"그는 어젯밤 꿈꾼 것을 이야기했다.", exTh:"เขาเล่าความฝันเมื่อคืน"},
{kr:"끌다", th:"ลาก, จูง, ดึง", level:"3급", ex:"멀리서 한 사람이 수레를 끌고 간다.", exTh:"ไกลๆ มีคนหนึ่งลากรถเข็นไป"},
{kr:"나서다", th:"ออกมายืน, ออกมา", level:"4급", ex:"이른 아침부터 길을 나섰다.", exTh:"ออกเดินทางตั้งแต่เช้าตรู่"},
{kr:"날리다", th:"ปลิว, ลอย, บิน", level:"4급", ex:"바람에 날리는 깃발이 보인다.", exTh:"เห็นธงที่ปลิวไปตามลม"},
{kr:"낳다", th:"คลอด, คลอดลูก, ออก(ไข่)", level:"3급", ex:"그녀는 아기를 낳은 지 일주일이 됐다.", exTh:"เธอคลอดลูกได้ 1 สัปดาห์แล้ว"},
{kr:"내놓다", th:"เอา...ออกมา, นำ...ออกมา, ผลิต...ออกมา", level:"4급", ex:"화분을 밖에서 내놓았다.", exTh:"เอากระถางต้นไม้ออกมาไว้ข้างนอก"},
{kr:"내다보다", th:"มองออกไป, มองไป", level:"4급", ex:"창 밖을 내다보니 이미 밤이었다.", exTh:"พอมองออกไปนอกหน้าต่างก็เป็นเวลากลางคืนแล้ว"},
{kr:"내려다보다", th:"มองลงไป, มองลง", level:"4급", ex:"아래를 내려다보니 아득했다.", exTh:"พอมองลงไปข้างล่างก็เห็นแบบเลือนราง"},
{kr:"내밀다", th:"ยื่น, ยื่นให้, ยื่นออกมา", level:"4급", ex:"그는 쓰러진 나에게 손을 내밀었다.", exTh:"เขายื่นมือให้ฉันที่ล้มลง"},
{kr:"넘기다", th:"เลย, เกินกำหนด, พ้น", level:"4급", ex:"결국 마감일을 넘겨 숙제를 제출했다.", exTh:"สุดท้ายก็ส่งการบ้านเกินกำหนดส่งไปแล้ว"},
{kr:"넘어서다", th:"ข้าม, ข้ามผ่าน", level:"3급", ex:"고개를 넘어서니 마침내 마을이 보였다.", exTh:"พอข้ามเนินเขาที่สูงที่สุดในหมู่บ้านก็มองเห็น"},
{kr:"넘치다", th:"ล้น, ท่วม, ทะลัก", level:"4급", ex:"홍수로 강물이 넘쳐 흘렀다.", exTh:"น้ำในแม่น้ำล้นทะลักเนื่องจากน้ำท่วม", syn:"ตรงข้าม: 모자라다"},
{kr:"놓이다", th:"โล่ง(ใจ), เบา(ใจ), สบาย(ใจ)", level:"3급", ex:"그의 소식을 듣고 마음이 놓였다.", exTh:"พอได้ยินข่าวคราวของเขาก็ใจโล่ง"},

/* ---------- SPEECH ---------- */
let koreanVoice = null;
function loadVoices(){
  const voices = speechSynthesis.getVoices();
  koreanVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ko')) || null;
}
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text){
  if(!('speechSynthesis' in window)){
    alert('ขออภัย อุปกรณ์นี้ไม่รองรับการอ่านออกเสียง');
    return;
  }
  speechSynthesis.cancel();
  const clean = text.replace(/[¹²]/g,'');
  const utter = new SpeechSynthesisUtterance(clean);
  utter.lang = 'ko-KR';
  if(koreanVoice) utter.voice = koreanVoice;
  utter.rate = 0.85;
  speechSynthesis.speak(utter);
}
function speakWord(){
  const idx = flashOrder[flashIndex];
  speak(VOCAB[idx].kr);
}

/* ---------- FLASHCARDS ---------- */
let flashOrder = VOCAB.map((_,i)=>i);
let flashIndex = 0;
let known = new Set();
let unknown = new Set();

function renderFlashcard(){
  const idx = flashOrder[flashIndex];
  const v = VOCAB[idx];
  document.getElementById('fcKr').textContent = v.kr;
  document.getElementById('fcLevel').textContent = v.level;
  document.getElementById('fcTh').textContent = v.th;
  document.getElementById('fcEx').textContent = v.ex + '\n' + v.exTh;
  document.getElementById('fcEx').style.whiteSpace = 'pre-line';
  document.getElementById('fcSyn').textContent = v.syn || '';
  document.getElementById('flashcard').classList.remove('flipped');
  document.getElementById('flashPos').textContent = (flashIndex+1) + ' / ' + VOCAB.length;
  document.getElementById('flashScore').textContent = 'รู้แล้ว ' + known.size + ' | ยังไม่รู้ ' + unknown.size;
  document.getElementById('flashProgress').style.width = ((flashIndex)/VOCAB.length*100) + '%';
}
document.getElementById('flashcard').addEventListener('click', function(){
  this.classList.toggle('flipped');
});
function nextCard(){
  flashIndex = (flashIndex+1) % VOCAB.length;
  renderFlashcard();
}
function prevCard(){
  flashIndex = (flashIndex-1+VOCAB.length) % VOCAB.length;
  renderFlashcard();
}
function markCard(isKnown){
  const idx = flashOrder[flashIndex];
  if(isKnown){known.add(idx); unknown.delete(idx);}
  else{unknown.add(idx); known.delete(idx);}
  nextCard();
}
function shuffleCards(){
  for(let i=flashOrder.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [flashOrder[i],flashOrder[j]] = [flashOrder[j],flashOrder[i]];
  }
  flashIndex = 0;
  renderFlashcard();
}
renderFlashcard();

/* ---------- NAV ---------- */
document.querySelectorAll('nav button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById(btn.dataset.view).classList.add('active');
    if(btn.dataset.view==='quiz') startQuiz();
    if(btn.dataset.view==='fill') startFill();
    if(btn.dataset.view==='list') renderList();
  });
});

/* ---------- QUIZ (multiple choice) ---------- */
let quizOrder = [];
let quizIndex = 0;
let quizScore = 0;

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startQuiz(){
  quizOrder = shuffleArr(VOCAB.map((_,i)=>i));
  quizIndex = 0;
  quizScore = 0;
  renderQuiz();
}

function renderQuiz(){
  const area = document.getElementById('quizArea');
  if(quizIndex >= quizOrder.length){
    area.innerHTML = '<div class="q-box score-box"><h2>เสร็จแล้ว! 🎉</h2><p>คะแนน: ' + quizScore + ' / ' + quizOrder.length + '</p><button class="btn btn-primary" onclick="startQuiz()">ทำใหม่</button></div>';
    return;
  }
  const idx = quizOrder[quizIndex];
  const v = VOCAB[idx];
  let distractors = shuffleArr(VOCAB.map((_,i)=>i).filter(i=>i!==idx)).slice(0,3);
  let options = shuffleArr([idx, ...distractors]);
  area.innerHTML = `
    <div class="q-box">
      <div class="q-count">ข้อ ${quizIndex+1} / ${quizOrder.length} &nbsp;|&nbsp; คะแนน ${quizScore}</div>
      <div class="q-text">${v.kr} <span style="font-size:0.8rem;color:var(--muted);">(${v.level})</span> แปลว่าอะไร?</div>
      <div class="options" id="quizOptions"></div>
      <div class="feedback" id="quizFeedback"></div>
    </div>
  `;
  const optContainer = document.getElementById('quizOptions');
  options.forEach(optIdx=>{
    const b = document.createElement('button');
    b.className = 'opt-btn';
    b.textContent = VOCAB[optIdx].th;
    b.onclick = ()=>answerQuiz(optIdx, idx, b);
    optContainer.appendChild(b);
  });
}

function answerQuiz(chosenIdx, correctIdx, btnEl){
  const buttons = document.querySelectorAll('#quizOptions .opt-btn');
  buttons.forEach(b=>b.disabled = true);
  buttons.forEach(b=>{
    if(b.textContent === VOCAB[correctIdx].th) b.classList.add('correct');
  });
  const fb = document.getElementById('quizFeedback');
  if(chosenIdx === correctIdx){
    quizScore++;
    fb.textContent = '✅ ถูกต้อง!';
    fb.className = 'feedback good';
  } else {
    btnEl.classList.add('wrong');
    fb.textContent = '❌ ผิด คำตอบที่ถูกคือ "' + VOCAB[correctIdx].th + '"';
    fb.className = 'feedback bad';
  }
  setTimeout(()=>{ quizIndex++; renderQuiz(); }, 1200);
}

/* ---------- FILL IN THE BLANK ---------- */
let fillOrder = [];
let fillIndex = 0;
let fillScore = 0;

function startFill(){
  fillOrder = shuffleArr(VOCAB.map((_,i)=>i));
  fillIndex = 0;
  fillScore = 0;
  renderFill();
}

function blankSentence(sentence, word){
  const base = word.replace(/[¹²]/g,'');
  // try to find the word stem in the sentence (Korean verbs are conjugated, so match first 1-2 chars)
  const stem = base.slice(0, Math.max(1, base.length-2));
  const re = new RegExp(stem + '[가-힣]*');
  const match = sentence.match(re);
  if(match){
    return sentence.replace(match[0], '<span class="blank">______</span>');
  }
  return sentence;
}

function renderFill(){
  const area = document.getElementById('fillArea');
  if(fillIndex >= fillOrder.length){
    area.innerHTML = '<div class="q-box score-box"><h2>เสร็จแล้ว! 🎉</h2><p>คะแนน: ' + fillScore + ' / ' + fillOrder.length + '</p><button class="btn btn-primary" onclick="startFill()">ทำใหม่</button></div>';
    return;
  }
  const idx = fillOrder[fillIndex];
  const v = VOCAB[idx];
  let distractors = shuffleArr(VOCAB.map((_,i)=>i).filter(i=>i!==idx)).slice(0,3);
  let options = shuffleArr([idx, ...distractors]);
  area.innerHTML = `
    <div class="q-box">
      <div class="q-count">ข้อ ${fillIndex+1} / ${fillOrder.length} &nbsp;|&nbsp; คะแนน ${fillScore}</div>
      <div class="q-sentence">${blankSentence(v.ex, v.kr)}</div>
      <div style="font-size:0.85rem;color:var(--muted);margin-bottom:14px;">คำแปล: ${v.exTh}</div>
      <div style="font-size:0.9rem;margin-bottom:10px;">เลือกคำกริยาที่เหมาะกับช่องว่าง (ความหมาย: <b>${v.th}</b>)</div>
      <div class="options" id="fillOptions"></div>
      <div class="feedback" id="fillFeedback"></div>
    </div>
  `;
  const optContainer = document.getElementById('fillOptions');
  options.forEach(optIdx=>{
    const b = document.createElement('button');
    b.className = 'opt-btn';
    b.textContent = VOCAB[optIdx].kr;
    b.onclick = ()=>answerFill(optIdx, idx, b);
    optContainer.appendChild(b);
  });
}

function answerFill(chosenIdx, correctIdx, btnEl){
  const buttons = document.querySelectorAll('#fillOptions .opt-btn');
  buttons.forEach(b=>b.disabled = true);
  buttons.forEach(b=>{
    if(b.textContent === VOCAB[correctIdx].kr) b.classList.add('correct');
  });
  const fb = document.getElementById('fillFeedback');
  if(chosenIdx === correctIdx){
    fillScore++;
    fb.textContent = '✅ ถูกต้อง!';
    fb.className = 'feedback good';
  } else {
    btnEl.classList.add('wrong');
    fb.textContent = '❌ ผิด คำตอบที่ถูกคือ "' + VOCAB[correctIdx].kr + '"';
    fb.className = 'feedback bad';
  }
  setTimeout(()=>{ fillIndex++; renderFill(); }, 1200);
}

/* ---------- LIST VIEW ---------- */
function renderList(){
  const area = document.getElementById('listArea');
  area.innerHTML = VOCAB.map((v,i) => `
    <div class="list-item">
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="word-kr">${v.kr} <span class="word-level">${v.level}</span></div>
        <button class="speak-btn" style="position:static;width:32px;height:32px;font-size:1rem;" onclick="speak('${v.kr.replace(/[¹²]/g,'')}')">🔊</button>
      </div>
      <div class="word-th">${v.th}</div>
      <div class="word-ex">${v.ex} — ${v.exTh}</div>
    </div>
  `).join('');
}
